<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HVAC Occupant Assistant</title>

</head>

<body>

<h1>HVAC Occupant Assistant</h1>

<p>
    Describe how the room feels. You can mention the room
    directly in your message.
</p>

<div id="chat"></div>

<form id="feedbackForm">

    <input
        type="text"
        id="complaint"
        placeholder="Example: Room 2 is too hot"
        autocomplete="off"
        required
    >

    <button type="submit">
        Send
    </button>

</form>

<script src="app.js"></script>


</body>

</html>
